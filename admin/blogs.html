<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>All Blogs | Shiftingpartner Admin</title>
<link rel="icon" type="image/png" href="/assets/logo/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/css/admin.css?v=202611272250">

</head>
<body class="admin" data-admin-page="blogs">
<div class="admin-boot" id="admin-boot"><div class="boot-spinner"></div><p>Checking access…</p></div>
<div class="admin-shell" id="admin-shell" hidden>
  <aside class="admin-side" id="admin-side">
    <a class="admin-brand" href="/admin/dashboard"><img src="/assets/logo/logo-header-light.png" alt="Shiftingpartner" width="720" height="122"></a>
    <p class="side-label">Content</p>
    <nav class="side-nav" aria-label="Admin navigation">
      <a href="/admin/dashboard" data-nav="dashboard"><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg#dashboard"></use></svg> Dashboard</a>
      <a href="/admin/blogs" data-nav="blogs" aria-current="page"><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg#news"></use></svg> All Blogs</a>
      <a href="/admin/add-blog" data-nav="add"><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg#plus"></use></svg> Add New Blog</a>
      <a href="/admin/categories" data-nav="categories"><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg#tag"></use></svg> Categories &amp; Tags</a>
    </nav>
    <p class="side-label">Website</p>
    <nav class="side-nav">
      <a href="/" target="_blank" rel="noopener"><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg#external"></use></svg> View Website</a>
      <a href="/blog" target="_blank" rel="noopener"><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg#external"></use></svg> View Blog</a>
    </nav>
    <div class="side-user">
      <span class="side-avatar" id="admin-avatar">A</span>
      <div><strong id="admin-email">admin</strong><small id="admin-role">Administrator</small></div>
      <button type="button" class="icon-btn" data-logout title="Log out" aria-label="Log out"><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg#logout"></use></svg></button>
    </div>
  </aside>
  <div class="admin-main">
    <header class="admin-top">
      <button type="button" class="icon-btn side-toggle" aria-label="Toggle menu" data-side-toggle><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg#menu"></use></svg></button>
      <div>
        <p class="top-crumb">Shiftingpartner Admin</p>
        <h1>All Blogs</h1>
      </div>
      <div class="top-actions" id="top-actions"></div>
    </header>
    <main class="admin-content">
<div class="toolbar">
  <div class="tabs" role="group" aria-label="Filter by status">
    <button type="button" data-status="all" aria-pressed="true">All<span class="count">0</span></button>
    <button type="button" data-status="published" aria-pressed="false">Published<span class="count">0</span></button>
    <button type="button" data-status="draft" aria-pressed="false">Drafts<span class="count">0</span></button>
    <button type="button" data-status="scheduled" aria-pressed="false">Scheduled<span class="count">0</span></button>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <select class="aselect" id="filter-cat" aria-label="Filter by category" style="width:auto"><option value="">All categories</option></select>
    <div class="search-input"><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg#search"></use></svg><input class="ainput" id="filter-q" type="search" placeholder="Search posts…" aria-label="Search posts"></div>
    <a class="abtn abtn-primary" href="/admin/add-blog"><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg#plus"></use></svg> <span>Add New</span></a>
  </div>
</div>
<div class="panel">
  <div class="table-wrap">
    <table class="atable">
      <thead><tr><th class="hide-sm"></th><th>Title</th><th class="hide-sm">Category</th><th>Status</th><th class="hide-sm">Date</th><th style="text-align:right">Actions</th></tr></thead>
      <tbody id="posts-body"><tr><td colspan="6"><div class="empty">Loading…</div></td></tr></tbody>
    </table>
  </div>
</div>
    </main>
  </div>
</div>
<div class="side-backdrop" data-side-toggle></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <h2 id="modal-title">Are you sure?</h2>
    <p id="modal-text"></p>
    <div class="modal-actions"><button type="button" class="abtn abtn-ghost" data-modal-cancel>Cancel</button><button type="button" class="abtn abtn-danger" data-modal-ok>Delete</button></div>
  </div>
</div>
<script src="/assets/js/config.js?v=202611272250"></script>

<script src="/assets/js/admin.js?v=202611272250"></script>

</body>
</html>
