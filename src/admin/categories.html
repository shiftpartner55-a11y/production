<div class="cat-grid">
  <div>
    <div class="panel">
      <div class="panel-head"><h2>Blog Categories</h2></div>
      <div id="cat-list"><div class="empty">Loading…</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Tags</h2></div>
      <div id="tag-list"><div class="empty">Loading…</div></div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2 id="cat-form-title">Add category</h2></div>
    <form class="panel-body" id="cat-form">
      <div class="afield"><label for="cat-name">Name</label><input class="ainput" id="cat-name" name="name" type="text" maxlength="60" required placeholder="e.g. Moving Tips"></div>
      <div class="afield"><label for="cat-slug">Slug</label><input class="ainput" id="cat-slug" name="slug" type="text" maxlength="60" placeholder="moving-tips"></div>
      <div class="afield"><label for="cat-desc">Description</label><textarea class="atextarea" id="cat-desc" name="description" maxlength="300"></textarea></div>
      <div class="btn-pair"><button type="submit" class="abtn abtn-primary">Add Category</button><button type="button" class="abtn abtn-ghost" id="cat-cancel" hidden>Cancel</button></div>
    </form>
  </div>
</div>
